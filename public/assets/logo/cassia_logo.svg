<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 160" width="100%" height="100%">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F5E6CA" />
      <stop offset="35%" stop-color="#D4AF37" />
      <stop offset="70%" stop-color="#AA820A" />
      <stop offset="100%" stop-color="#E9D59B" />
    </linearGradient>
    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Subtle Botanical Insignia / Monogram -->
  <g transform="translate(300, 36)" text-anchor="middle">
    <path d="M-18,-12 C-8,-22 8,-22 18,-12 C10,-2 2,4 -18,-12 Z" fill="none" stroke="url(#goldGrad)" stroke-width="1.2" opacity="0.85" />
    <path d="M18,-12 C8,-22 -8,-22 -18,-12 C-10,-2 -2,4 18,-12 Z" fill="none" stroke="url(#goldGrad)" stroke-width="1.2" opacity="0.85" />
    <circle cx="0" cy="-14" r="2.5" fill="url(#goldGrad)" />
  </g>

  <!-- Wordmark -->
  <text x="300" y="98" 
        font-family="'Cinzel', 'Playfair Display', serif" 
        font-size="44" 
        font-weight="500" 
        letter-spacing="0.32em" 
        fill="url(#goldGrad)" 
        text-anchor="middle"
        filter="url(#subtleGlow)">
    CASSIA
  </text>
  
  <!-- Subtitle -->
  <text x="300" y="130" 
        font-family="'Plus Jakarta Sans', sans-serif" 
        font-size="9" 
        font-weight="400" 
        letter-spacing="0.48em" 
        fill="#A69B8D" 
        text-anchor="middle">
    COFFEE · FOOD · BAR — GORAKHPUR
  </text>
</svg>
